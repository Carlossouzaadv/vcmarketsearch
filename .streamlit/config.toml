[theme]
primaryColor = "#00d4aa"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e3a5f"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
# Prevent session timeout during long analysis runs
# Set to 60 minutes (3600 seconds) to handle long-running analyses
sessionTimeout = 3600
# Keep websocket connection alive
websocketMaxMessageSize = 100
# Enable session persistence
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
